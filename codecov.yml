coverage:
  status:
    # Fails the PR when total coverage is below 80%.
    project:
      default:
        target: 80%
    # Coverage of the lines a PR changes: shown, never blocks.
    patch:
      default:
        target: 80%
        informational: true

comment:
  layout: "header, diff, files"
  require_changes: false

# Generated code and widget previews.
ignore:
  - "**/*.g.dart"
  - "**/*.freezed.dart"
  - "**/*_previews.dart"
  - "lib/ui/shared/components/app_preview.dart"
