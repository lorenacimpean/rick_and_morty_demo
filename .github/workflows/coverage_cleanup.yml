name: Coverage cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  remove-report:
    name: Remove the PR's coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Delete pr/${{ github.event.number }}
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          [ -d "pr/$PR_NUMBER" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq "pr/$PR_NUMBER"
          git commit -qm "Remove the coverage report of PR #$PR_NUMBER"
          git push
