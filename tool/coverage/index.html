<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coverage history</title>
  <style>
    :root {
      --bg: #f7f8fa; --card: #ffffff; --text: #1c2330; --muted: #5d6778;
      --line: #e3e6eb; --good: #2da44e; --fair: #d4760a; --bad: #cf222e; --accent: #6b8e23;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f17; --card: #141a24; --text: #e6e9ef; --muted: #98a1b2;
        --line: #252d3a; --good: #3fb950; --fair: #e3a03a; --bad: #f85149; --accent: #97ce4c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 32px 16px; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 960px; margin: 0 auto; display: grid; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    h1 { margin: 0; font-size: 22px; }
    .muted { color: var(--muted); }
    .hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 24px; }
    .total { font-size: 48px; font-weight: 700; line-height: 1; }
    .good { color: var(--good); } .fair { color: var(--fair); } .bad { color: var(--bad); }
    a { color: var(--accent); }
    .chart { position: relative; height: 320px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: 13px; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    code { font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="card hero">
      <div>
        <h1>Coverage on master</h1>
        <div class="muted" id="subtitle">Loading…</div>
      </div>
      <div class="total" id="total">–</div>
      <a href="master/">Full report →</a>
    </div>
    <div class="card"><div class="chart"><canvas id="chart"></canvas></div></div>
    <div class="card">
      <table>
        <thead><tr><th>Commit</th><th>Date</th><th class="num">Coverage</th><th class="num">Change</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    const kMinimum = 80;
    const kFair = 60;
    // owner.github.io/repo → github.com/owner/repo, for commit links.
    const repoUrl = `https://github.com/${location.hostname.split('.')[0]}/${location.pathname.split('/')[1]}`;
    const tone = (value) => value >= kMinimum ? 'good' : value >= kFair ? 'fair' : 'bad';
    const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const percent = (value) => `${value.toFixed(1)}%`;

    function change(entries, index) {
      if (index === 0) return '';
      const delta = entries[index].total - entries[index - 1].total;
      if (delta > 0) return `<span class="good">▲ +${delta.toFixed(1)}%</span>`;
      if (delta < 0) return `<span class="bad">▼ −${Math.abs(delta).toFixed(1)}%</span>`;
      return '<span class="muted">= 0.0%</span>';
    }

    function row(entries, index) {
      const entry = entries[index];
      const sha = entry.sha.slice(0, 7);
      return `<tr>
        <td><a href="${repoUrl}/commit/${entry.sha}"><code>${sha}</code></a></td>
        <td class="muted">${new Date(entry.date).toLocaleString()}</td>
        <td class="num ${tone(entry.total)}">${percent(entry.total)}</td>
        <td class="num">${change(entries, index)}</td>
      </tr>`;
    }

    function drawChart(entries) {
      const labels = entries.map((entry) => entry.sha.slice(0, 7));
      new Chart(document.getElementById('chart'), {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: 'Coverage',
              data: entries.map((entry) => entry.total),
              borderColor: css('--accent'),
              backgroundColor: css('--accent'),
              tension: 0.25,
              pointRadius: 3,
            },
            {
              label: `Minimum (${kMinimum}%)`,
              data: entries.map(() => kMinimum),
              borderColor: css('--bad'),
              borderDash: [6, 6],
              pointRadius: 0,
            },
          ],
        },
        options: {
          maintainAspectRatio: false,
          scales: {
            y: { min: 0, max: 100, ticks: { callback: (value) => `${value}%`, color: css('--muted') }, grid: { color: css('--line') } },
            x: { ticks: { color: css('--muted') }, grid: { display: false } },
          },
          plugins: { legend: { labels: { color: css('--text') } } },
        },
      });
    }

    function show(entries) {
      const latest = entries[entries.length - 1];
      const total = document.getElementById('total');
      total.textContent = percent(latest.total);
      total.className = `total ${tone(latest.total)}`;
      document.getElementById('subtitle').textContent =
        `${entries.length} commits · last ${new Date(latest.date).toLocaleDateString()}`;
      document.getElementById('rows').innerHTML =
        entries.map((_, index) => row(entries, index)).reverse().join('');
      drawChart(entries);
    }

    fetch('history.json', { cache: 'no-store' })
      .then((response) => response.ok ? response.json() : [])
      .then((entries) => entries.length
        ? show(entries)
        : document.getElementById('subtitle').textContent = 'No coverage recorded yet.')
      .catch(() => document.getElementById('subtitle').textContent = 'Couldn’t load the history.');
  </script>
</body>
</html>
